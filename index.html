<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Juntos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #8c5d2b;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .carousel {
            margin-top: 50px;
            width: 90%;
            max-width: 800px; /* Aumente o tamanho máximo para deixar as imagens maiores */
            overflow: hidden;
            position: relative;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .carousel {
            margin-top: 50px;
            width: 90%;
            max-width: 800px; /* Tamanho máximo aumentado para imagens maiores */
            overflow: hidden;
            position: relative;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 500px; /* Define uma altura fixa para o carrossel */
        }

        .carousel-images {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%; /* Garante que as imagens ocupem toda a altura do carrossel */
        }

        .carousel-images img {
            width: 100%; /* As imagens ocupam 100% da largura */
            height: 100%; /* As imagens ocupam 100% da altura do carrossel */
            object-fit: cover; /* Ajusta as imagens para preencher o espaço sem distorções */
            flex-shrink: 0;
            border-radius: 10px;
        }

        .counter {
            text-align: center;
        }

        .counter p {
            font-size: 1.2em;
            margin: 5px 0;
        }

        .highlight {
            font-size: 1.8em;
            font-weight: bold;
        }

        .descricao {
            text-align: justify;
            margin: 40px;
        }

        .heart {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: rgb(234, 9, 28);
            clip-path: path("M12 4.248c-3.148-5.402-12-3.825-12 2.944 0 4.661 5.571 9.427 12 15.808 6.43-6.381 12-11.147 12-15.808 0-6.792-8.875-8.306-12-2.944z");


            animation: fall 7s linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0) scale(1);
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) translateX(30px) scale(0.5);
                opacity: 0;
            }
        }

    </style>
</head>
<body>
    <div class="carousel">
        <div class="carousel-images">
            <img src="AeO @alcynarfotografia-161.jpg" alt="Imagem 1">
            <img src="AeO @alcynarfotografia-256.jpg" alt="Imagem 2">
            <img src="DSC_1158.jpg" alt="Imagem 3">
            <img src="DSC_1417.jpg" alt="Imagem 4">
        </div>
    </div>

    <div class="counter">
        <p>Juntos a:</p>
        <p class="highlight" id="timeTogether"></p>
    </div>
    <br><br>
    _____________________________________
    <div class="descricao">
     <p>Meu amor, saiba que pra sempre te amaria e que estarei sempre ao seu lado lhe apoiando e vivendo o melhor da vida independente do tempo. ❤️</p>
    </div>
    <br>
    <br>
    <script>
        // Carrossel
        const carouselImages = document.querySelector('.carousel-images');
        const images = document.querySelectorAll('.carousel-images img');
        let index = 0;

        function changeImage() {
            index = (index + 1) % images.length;
            carouselImages.style.transform = `translateX(-${index * 100}%)`;
        }

        setInterval(changeImage, 4000);

        // Contador de tempo juntos
        function calculateTimeTogether() {
            const startDate = new Date("2015-08-12T00:00:00");
            const now = new Date();
            const diff = now - startDate;

            const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
            const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
            const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timeTogether').textContent =
                `${years} anos, ${months} meses, ${days} dias, ${hours} horas, ${minutes} minutos e ${seconds} segundos`;
        }

        // Animação de corações caindo
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.animationDuration = `${Math.random() * 2 + 3}s`;
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        setInterval(calculateTimeTogether, 1000);
    </script>
</body>
</html>
